<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f6f3">
<meta name="description" content="Open Up, an interactive school wellbeing prototype for GTSU2037">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Open Up</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
<script defer src="./app.js"></script>

<body class="app-page">
<div class="phone-shell">

    <span>9:41</span>
    <span class="phone-status-icons"><i class="status-signal"></i><i class="status-battery"></i></span>

  <div class="workspace" id="phone-screen">

      <a class="brand" href="#today"><img src="./icon-192.png" width="38" height="38" alt=""><span>Open Up</span></a>
      <button type="button" class="app-privacy" data-action="privacy"><span data-icon="shield"></span> Privacy</button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="footer"><span>Open Up · GTSU2037</span><a href="./flow.html" target="_top">User flow demo</a></footer>
  </div>
  <nav id="phone-nav" class="phone-nav" aria-label="App navigation"></nav>
  <div class="phone-home" aria-hidden="true"></div>
  <div id="toast" role="status"></div>
</div>
<dialog id="dialog"><div id="dialog-content"></div></dialog>
